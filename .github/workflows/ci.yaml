name: CI
on: workflow_dispatch
jobs:
    build:
        runs-on: ubuntu-22.04
        strategy:
            matrix:
                node-version: [20]
        steps:
            - uses: actions/checkout@v4
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.13.2
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "pnpm"
            - name: Install dependencies
              run: pnpm install
            - name: Build repo
              run: pnpm build
            - name: Clean repo
              run: pnpm clean
            - name: Install production dependencies
              run: pnpm install --prod
            - name: Upload a Build Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-artifact
                  path: .
                  if-no-files-found: error
                  retention-days: 5
    containerize:
        runs-on: ubuntu-22.04
        needs: build
        steps:
            - name: Download a Build Artifact
              uses: actions/download-artifact@v4
              with:
                  name: build-artifact
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Build & Push the Docker image (render)
              run: |
                  IMAGE_NAME=eltumero/graviola-render
                  FILE_NAME=./docker/render.Dockerfile
                  COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
                  docker build --platform linux/amd64,linux/arm64 --file $FILE_NAME -t $IMAGE_NAME:$COMMIT_SHA -t $IMAGE_NAME:latest .
                  docker push $IMAGE_NAME --all-tags
